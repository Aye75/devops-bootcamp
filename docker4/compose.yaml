services:
  profile:
    image: redis
    volumes:
      - me:/data

  server:
    image: ghcr.io/infratify/arena-server

  avatar:
    image: ghcr.io/infratify/arena-avatar
    ports:
      - "8080:8080"
    environment:
      NAME: AYE
      COLOR: red
      SERVER: 13.213.70.70
  

    depends_on:
      - profile


volumes:
  me:
